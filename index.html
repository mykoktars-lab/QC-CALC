<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b67">
<meta name="description" content="QC-CALC - Quality Control Laboratory Calculator">
<link rel="manifest" href="manifest.json">
<title>QC-CALC | Laboratory System</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #eef3f8;
  color: #18314c;
}

.container {
  max-width: 650px;
  margin: auto;
}

header {
  background: #123b67;
  color: white;
  padding: 30px 24px;
  border-radius: 18px;
  margin-bottom: 25px;
}

header h1 {
  margin: 0 0 10px;
  font-size: 30px;
}

header p {
  margin: 0;
  color: #d9e8f8;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 18px;
  margin-bottom: 20px;
  box-shadow: 0 5px 20px #0000000d;
}

.card h2 {
  margin-top: 0;
  color: #123b67;
}

.subtitle {
  color: #788797;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin: 18px 0 8px;
}

input {
  width: 100%;
  padding: 15px;
  border: 1px solid #ccd5df;
  border-radius: 10px;
  font-size: 17px;
  outline: none;
}

input:focus {
  border-color: #2676b7;
}

button {
  width: 100%;
  padding: 17px;
  margin-top: 22px;
  border: none;
  border-radius: 10px;
  background: #176caf;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #12568c;
}

.result {
  display: none;
  margin-top: 22px;
  padding: 20px;
  border-radius: 12px;
  background: #edf5fc;
}

.result h3 {
  margin-top: 0;
}

.value {
  font-size: 34px;
  font-weight: bold;
  color: #176caf;
}

.status {
  padding: 12px;
  border-radius: 8px;
  font-weight: bold;
  margin-top: 15px;
}

.pass {
  background: #d9f5e4;
  color: #176b37;
}

.fail {
  background: #ffe0e0;
  color: #a51d1d;
}

.warning {
  background: #fff1cd;
  color: #805800;
}

footer {
  text-align: center;
  color: #83909d;
  font-size: 12px;
  padding: 20px;
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>QC-CALC</h1>
  <p>Quality Control Laboratory System</p>
</header>

<div class="card">
  <h2>FFA Calculator</h2>
  <p class="subtitle">Free Fatty Acid Analysis</p>

  <label>Berat Sampel (gram)</label>
  <input id="berat" type="number" step="any"
    min="0.000001" placeholder="Contoh: 7.8">

  <label>Volume Titrasi (mL)</label>
  <input id="volume" type="number" step="any"
    min="0" placeholder="Contoh: 0.25">

  <label>Normalitas KOH</label>
  <input id="normalitas" type="number" step="any"
    min="0.000001" placeholder="Contoh: 0.1">

  <label>Batas Maksimum FFA (%)</label>
  <input id="standar" type="number" step="any"
    min="0" placeholder="Masukkan standar SOP">

  <button onclick="hitungFFA()">HITUNG FFA</button>

  <div id="hasil" class="result" aria-live="polite">
    <h3>Hasil Analisis FFA</h3>
    <div id="nilai" class="value">0.0000%</div>
    <div id="status" class="status"></div>
    <p id="keterangan"></p>
  </div>
</div>

<footer>
  QC-CALC Laboratory System<br>
  Hasil perhitungan harus diverifikasi dengan SOP laboratorium.
</footer>

</div>

<script>
function hitungFFA() {
  const berat = Number(document.getElementById("berat").value);
  const volume = Number(document.getElementById("volume").value);
  const normalitas = Number(document.getElementById("normalitas").value);
  const standarInput = document.getElementById("standar").value;

  const hasil = document.getElementById("hasil");
  const status = document.getElementById("status");
  const nilai = document.getElementById("nilai");
  const keterangan = document.getElementById("keterangan");

  hasil.style.display = "block";
  status.className = "status";

  if (
    document.getElementById("berat").value === "" ||
    document.getElementById("volume").value === "" ||
    document.getElementById("normalitas").value === "" ||
    standarInput === "" ||
    !Number.isFinite(berat) ||
    !Number.isFinite(volume) ||
    !Number.isFinite(normalitas) ||
    !Number.isFinite(Number(standarInput)) ||
    berat <= 0 || volume < 0 ||
    normalitas <= 0 || Number(standarInput) < 0
  ) {
    nilai.textContent = "--";
    status.classList.add("warning");
    status.textContent = "DATA TIDAK VALID";
    keterangan.textContent =
      "Periksa kembali semua angka yang dimasukkan.";
    return;
  }

  const standar = Number(standarInput);

  // Faktor 25,6: asumsi metode berbasis asam palmitat.
  const ffa = (volume * normalitas * 25.6) / berat;

  nilai.textContent = ffa.toFixed(4) + "%";

  if (ffa <= standar) {
    status.classList.add("pass");
    status.textContent = "MEMENUHI STANDAR";
    keterangan.textContent =
      "Hasil FFA berada dalam batas maksimum yang dimasukkan.";
  } else {
    status.classList.add("fail");
    status.textContent = "TIDAK MEMENUHI STANDAR";
    keterangan.textContent =
      "PERINGATAN: Hasil FFA melebihi batas maksimum!";
  }
}
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>

</body>
</html>
